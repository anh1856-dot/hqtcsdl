<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123c2b">
  <title>Nấm Smart | Trang trại thông minh</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">
    <!-- Màn hình đăng nhập -->
    <section id="auth" class="auth hidden"></section>

    <!-- Khung chính sau khi đăng nhập -->
    <div id="shell" class="shell hidden">
      <header class="topbar"><div class="top-brand"><div class="brand-mark">🍄</div><div><strong>NẤM SMART</strong><small>SMART FARM PLATFORM</small></div></div>
        <button id="backBtn" class="icon-btn hidden" data-action="back" aria-label="Quay lại">‹</button>
        <h1 id="title" class="sr-only">Khay của tôi</h1>
        <button class="icon-btn" data-action="refresh" aria-label="Tải lại">⟳</button>
      </header>
      <main id="main" class="main"></main>
      <nav class="tabbar" id="tabbar">
        <button data-tab="trays"><span class="ico">🍄</span><span>Khay</span></button>
        <button data-tab="rent"><span class="ico">🛒</span><span>Thuê</span></button>
        <button data-tab="harvest"><span class="ico">🧺</span><span>Thu hoạch</span></button>
        <button data-tab="notif"><span class="ico">🔔</span><span>Thông báo</span><i id="badge" class="badge hidden">0</i></button>
        <button data-tab="me"><span class="ico">👤</span><span>Tôi</span></button>
      </nav>
    </div>

    <div id="modal" class="modal hidden"></div>
    <div id="toast" class="toast hidden"></div>
  </div>
  <script src="js/mock-api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
